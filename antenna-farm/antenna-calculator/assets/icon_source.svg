<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" version="1.1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <!-- Background gradient -->
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
   <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
  </linearGradient>
 </defs>

 <!-- Background -->
 <rect width="512" height="512" fill="url(#bgGrad)" rx="80"/>

 <!-- Tower and Antennas Silhouette -->
 <g fill="#000000" opacity="0.9">

  <!-- Tower pole (center) -->
  <rect x="246" y="100" width="20" height="300" rx="3"/>

  <!-- Tower lattice details -->
  <polygon points="246,150 266,170 264,172 244,152"/>
  <polygon points="266,150 246,170 248,172 268,152"/>
  <polygon points="246,220 266,240 264,242 244,222"/>
  <polygon points="266,220 246,240 248,242 268,222"/>
  <polygon points="246,290 266,310 264,312 244,292"/>
  <polygon points="266,290 246,310 248,312 268,292"/>

  <!-- 1. TOP: Monopole/Vertical -->
  <circle cx="256" cy="95" r="6"/>
  <rect x="253" y="60" width="6" height="35" rx="3"/>
  <!-- Ground radials -->
  <polygon points="256,95 236,105 234,102 254,92"/>
  <polygon points="256,95 276,105 278,102 258,92"/>
  <polygon points="256,95 246,110 243,108 253,93"/>
  <polygon points="256,95 266,110 269,108 259,93"/>

  <!-- 2. Yagi-Uda Antenna -->
  <!-- Boom -->
  <rect x="190" y="134" width="132" height="6" rx="3"/>

  <!-- Reflector -->
  <rect x="195" y="105" width="5" height="64" rx="2"/>

  <!-- Driven element -->
  <rect x="230" y="112" width="5" height="50" rx="2"/>

  <!-- Directors -->
  <rect x="256" y="117" width="4" height="40" rx="2"/>
  <rect x="278" y="121" width="4" height="32" rx="2"/>
  <rect x="297" y="124" width="4" height="26" rx="2"/>
  <rect x="313" y="127" width="4" height="20" rx="2"/>

  <!-- 3. Moxon Rectangle -->
  <g transform="translate(256, 195)">
   <!-- Left element with tail -->
   <path d="M -45,0 L -45,-18 L -50,-18 L -50,-24 L -40,-24 L -40,-18 L -45,-18 Z"/>
   <path d="M -45,0 L -45,18 L -50,18 L -50,24 L -40,24 L -40,18 L -45,18 Z"/>

   <!-- Right element with tail -->
   <path d="M 45,0 L 45,-18 L 50,-18 L 50,-24 L 40,-24 L 40,-18 L 45,-18 Z"/>
   <path d="M 45,0 L 45,18 L 50,18 L 50,24 L 40,24 L 40,18 L 45,18 Z"/>

   <!-- Connection boom -->
   <rect x="-45" y="-3" width="90" height="6" rx="2"/>
  </g>

  <!-- 4. Dipole Antenna -->
  <!-- Left element -->
  <rect x="196" y="255" width="5" height="40" rx="2"/>
  <!-- Right element -->
  <rect x="311" y="255" width="5" height="40" rx="2"/>
  <!-- Center insulator -->
  <circle cx="256" cy="275" r="8"/>

  <!-- 5. Ladder Line / Log Periodic -->
  <!-- Two parallel lines -->
  <rect x="220" y="320" width="4" height="50" rx="1"/>
  <rect x="288" y="320" width="4" height="50" rx="1"/>

  <!-- Rungs -->
  <rect x="220" y="325" width="72" height="3" rx="1"/>
  <rect x="220" y="335" width="72" height="3" rx="1"/>
  <rect x="220" y="345" width="72" height="3" rx="1"/>
  <rect x="220" y="355" width="72" height="3" rx="1"/>
  <rect x="220" y="365" width="72" height="3" rx="1"/>

  <!-- Elements -->
  <rect x="205" y="322" width="15" height="2.5" rx="1"/>
  <rect x="292" y="322" width="15" height="2.5" rx="1"/>
  <rect x="208" y="332" width="12" height="2.5" rx="1"/>
  <rect x="292" y="332" width="12" height="2.5" rx="1"/>
  <rect x="210" y="342" width="10" height="2.5" rx="1"/>
  <rect x="292" y="342" width="10" height="2.5" rx="1"/>

  <!-- Tower base -->
  <ellipse cx="256" cy="408" rx="35" ry="8"/>
 </g>

</svg>
